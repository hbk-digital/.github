name: Bug
description: An unexpected problem or behaviour (code repositories).
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
  - type: input
    id: version
    attributes:
      label: Version or environment
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: This issue contains no client data or confidential figures.
          required: true
